<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeJob — Report Submitted</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0e1a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1f3a 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 20%, #1a0a0a 0%, transparent 50%);
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 60px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon { font-size: 64px; margin-bottom: 24px; }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 38px;
            margin-bottom: 14px;
        }

        h1 span { color: #90EE90; }

        p {
            color: #8892a4;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .helpline {
            background: rgba(230,57,70,0.1);
            border: 1px solid rgba(230,57,70,0.3);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 36px;
            font-size: 14px;
            color: #ff8a94;
        }

        .helpline strong {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            letter-spacing: 2px;
            margin-top: 4px;
            color: #e63946;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s;
            margin: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e63946, #c1121f);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(230,57,70,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: #8892a4;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Report <span>Submitted</span></h1>
        <p>Thank you for reporting this suspicious job offer. Your report has been saved and will help protect other vulnerable workers from trafficking traps.</p>

        <div class="helpline">
            If you or someone you know is in danger, call the Anti-Trafficking Helpline:
            <strong>1800-419-8588</strong>
        </div>

        <div>
            <a href="/check-job" class="btn btn-primary">Check Another Job</a>
            <a href="/" class="btn btn-secondary">Go Home</a>
        </div>
    </div>
</body>
</html>
